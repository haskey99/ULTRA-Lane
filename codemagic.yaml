workflows:
  ios-unsigned:
    name: iOS Unsigned for Sideloadly
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - node
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20.19.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm run build
          npx cap sync ios
          npx cap copy ios
      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update
      - name: Build unsigned IPA for Sideloadly
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -archivePath $CM_BUILD_DIR/App.xcarchive archive CODE_SIGNING_ALLOWED=NO
          mkdir -p $CM_BUILD_DIR/Payload
          cp -r $CM_BUILD_DIR/App.xcarchive/Products/Applications/App.app $CM_BUILD_DIR/Payload/
          cd $CM_BUILD_DIR
          zip -r ULTRA-LANE-unsigned.ipa Payload
    artifacts:
      - $CM_BUILD_DIR/ULTRA-LANE-unsigned.ipa
