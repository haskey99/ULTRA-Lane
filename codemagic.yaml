workflows:
  ios-app-store:
    name: iOS App Store TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_ID: "com.haskey.ultralane.A837388W4F"
      node: 20.19.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/assets --save-dev
          npx vite build
          node -e "const fs=require('fs'); let c=JSON.parse(fs.readFileSync('capacitor.config.json','utf8')); c.appId='com.haskey.ultralane.A837388W4F'; fs.writeFileSync('capacitor.config.json', JSON.stringify(c,null,2));"
          rm -rf ios
          npx cap add ios
          npx capacitor-assets generate --ios
          npx cap sync ios
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" ios/App/App/Info.plist || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" ios/App/App/Info.plist
      - name: Set iOS 15 minimum
        script: |
          sed -i.bak "s/13.0/15.0/g" ios/App/Podfile || true
          sed -i.bak "s/14.0/15.0/g" ios/App/Podfile || true
          perl -pi -e "s/IPHONEOS_DEPLOYMENT_TARGET = 13.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g" ios/App/App.xcodeproj/project.pbxproj || true
          perl -pi -e "s/IPHONEOS_DEPLOYMENT_TARGET = 14.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g" ios/App/App.xcodeproj/project.pbxproj || true
          perl -pi -e "s/IPHONEOS_DEPLOYMENT_TARGET = 12.0/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g" ios/App/App.xcodeproj/project.pbxproj || true
          echo "platform :ios, '15.0'" > /tmp/platform_fix
          grep -q "platform :ios" ios/App/Podfile || cat /tmp/platform_fix >> ios/App/Podfile
      - name: Install Pods
        script: |
          cd ios/App
          pod install --repo-update
          find . -name "*.pbxproj" -exec perl -pi -e "s/IPHONEOS_DEPLOYMENT_TARGET = 1[0-4]\.[0-9]/IPHONEOS_DEPLOYMENT_TARGET = 15.0/g" {} \;
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
          VERSION=$(node -p "require('../../package.json').version")
          agvtool new-marketing-version $VERSION
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$APP_ID" --type IOS_APP_STORE --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA for App Store
        script: |
          mkdir -p build/ios/ipa
          xcodebuild -workspace "$XCODE_WORKSPACE" -scheme "$XCODE_SCHEME" -configuration Release -archivePath /tmp/App.xcarchive archive CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM=A837388W4F COMPILER_INDEX_STORE_ENABLE=NO IPHONEOS_DEPLOYMENT_TARGET=15.0
          xcodebuild -exportArchive -archivePath /tmp/App.xcarchive -exportPath build/ios/ipa -exportOptionsPlist /tmp/ExportOptions.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
