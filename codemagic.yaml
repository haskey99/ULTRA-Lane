workflows:
  ios-app-store:
    name: iOS App Store TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials
      vars:
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
        APP_ID: "com.haskey.ultralane"
      node: 20.19.0
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npx vite build
          # Force bundle ID to com.haskey.ultralane - robust version
          node -e "const fs=require('fs'); let p='capacitor.config.json'; let c=JSON.parse(fs.readFileSync(p,'utf8')); c.appId='com.haskey.ultralane'; fs.writeFileSync(p, JSON.stringify(c,null,2)); console.log('Fixed appId to', c.appId)"
          cat capacitor.config.json | grep appId
          rm -rf ios
          npx cap add ios
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --ios --iconBackgroundColor "#000000" --splashBackgroundColor "#000000"
          npx cap sync ios
          # Force Xcode bundle ID too
          sed -i '' 's/PRODUCT_BUNDLE_IDENTIFIER = .*/PRODUCT_BUNDLE_IDENTIFIER = com.haskey.ultralane;/g' ios/App/App.xcodeproj/project.pbxproj
          grep -m1 "PRODUCT_BUNDLE_IDENTIFIER" ios/App/App.xcodeproj/project.pbxproj
      - name: Install Pods
        script: |
          cd ios/App
          pod install --repo-update
      - name: Set up code signing
        script: |
          keychain initialize
          app-store-connect fetch-signing-files $APP_ID --type IOS_APP_STORE --create
          ls -lh ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "No profiles yet"
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA for App Store
        script: |
          xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
